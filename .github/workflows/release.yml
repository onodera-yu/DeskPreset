name: release

# Every merge into main is a release: the version comes from Directory.Build.props,
# the tag v<Version> is created and the zip is attached to a GitHub Release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          "version=$v" >> $env:GITHUB_OUTPUT
          if (git tag -l "v$v") {
            "exists=true" >> $env:GITHUB_OUTPUT
            Write-Host "::warning::v$v is already released; nothing to do. Bump <Version> in Directory.Build.props."
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
          }

      - uses: actions/setup-dotnet@v4
        if: steps.version.outputs.exists == 'false'
        with:
          global-json-file: global.json

      - name: Build zip
        if: steps.version.outputs.exists == 'false'
        shell: pwsh
        run: ./build.ps1 -Version ${{ steps.version.outputs.version }}

      - name: Publish release
        if: steps.version.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*.zip
          generate_release_notes: true
